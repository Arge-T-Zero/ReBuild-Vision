# ReBuild Vision — Render dağıtım tanımı (Blueprint)
#
# Veri tabanı burada TANIMLANMAZ: PostGIS gerektiği için Supabase kullanılır
# ve bağlantı dizesi ortam değişkeni olarak verilir.
#
# ⚠️ Bu ortamda YALNIZCA SENTETİK DEMO VERİSİ bulunur.
# Bakanlık tarafından sağlanan veri ve maskelenmemiş saha fotoğrafı buraya
# ASLA yüklenmez (şartname Madde 9.1 ve 10.5).

services:
  # --- Model servisi (canlı ortamda GERÇEK) -----------------------------
  # AGPL sınırı gereği model her zaman AYRI bir serviste kalır
  # (docs/lisans-analizi.md 3.4).
  #
  # ⚠️ BU SERVİS 06.09.2026'YA KADAR SAHTEYDİ ve arayüzde her ekranda
  # kalıcı "SAHTE MODEL SERVİSİ" bandı görünüyordu.
  #
  # Sebep ölçülmüştü: torch yolu tepe 810 MB yerleşik bellek (RSS)
  # istiyor, ücretsiz katman 512 MB veriyor. Çözüm modeli küçültmek ya da
  # bandı gizlemek değil, ÇALIŞMA ZAMANINI değiştirmek oldu: aynı ağırlık
  # ONNX Runtime ile 281 MB'da kalıyor.
  #
  # Aynı model, aynı sayılar — uydurma değil:
  #   tests/test_onnx_esdegerlik.py  (sınıf listesi, ön işleme, tespitler)
  #   results/onnx-dogrulama.md      (ölçümler)
  #
  # Ağırlık depoda değildir; imaj onu derleme sırasında yayın varlığından
  # indirir. İNDİREMEZSE SAHTE VERİ ÜRETİLMEZ: /health
  # `agirlik_yuklendi: false` der, /predict 503 döner ve arayüz bunu
  # olduğu gibi gösterir (ana talimat Bölüm 9.5).
  #
  # Torch yolu kaldırılmadı; yerelde tam paket hâlâ odur:
  #   docker compose -f docker/compose.yaml \
  #                  -f docker/compose.gercek-model.yaml up --build
  - type: web
    name: rebuild-vision-model
    runtime: docker
    dockerfilePath: ./docker/model-service-onnx.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # Başlatma komutu Dockerfile'dadır (kabuk biçimi CMD, ${PORT} genişler).
    # Render'ın dockerCommand alanı çok parçalı bir sh -c dizesini doğru
    # ayrıştırmıyor ve çıkış kodu 127 veriyordu.

  # --- API ---------------------------------------------------------------
  - type: web
    name: rebuild-vision-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /
    # Şema göçü her açılışta uygulanır; ayrıca komut çalıştırmak gerekmez.
    # Şema göçü ve demo verisi açılışta docker/baslat-api.sh içinde
    # çalışır; ayrıca komut vermeye gerek yoktur.
    envVars:
      # ORTAM=uretim iken varsayılan JWT anahtarıyla uygulama BAŞLAMAZ.
      # Bu bilinçli bir korumadır: o anahtar depoda açıkça yazılıdır.
      - key: ORTAM
        value: uretim

      # Render bunu kendisi üretir; kimse görmez, kopyalanmaz.
      - key: JWT_GIZLI_ANAHTAR
        generateValue: true

      # Supabase bağlantı dizesi — Render panelinden ELLE girilir.
      # Biçim (Session pooler, IPv4):
      #   postgresql+asyncpg://postgres.<REF>:<PAROLA>@aws-0-<BOLGE>.pooler.supabase.com:5432/postgres
      - key: VERITABANI_URL
        sync: false

      # fromService/hostport şemasız (host:port) döner; istemci tam URL
      # bekliyor. Ücretsiz katmanda özel ağ da yok, bu yüzden servisin
      # genel adresi doğrudan yazılır.
      - key: MODEL_SERVICE_URL
        value: https://rebuild-vision-model.onrender.com

      # Arayüz Vercel'de; /api istekleri oradan vekillenir.
      - key: IZIN_VERILEN_KAYNAKLAR
        value: https://re-build-vision.vercel.app

      # ⚠️ DEMO_VERISI_ZORLA BURADA TANIMLI DEĞİLDİR — BİLİNÇLİ.
      #
      # Demo verisi artık kendi sürüm damgasına bakıyor
      # (scripts/demo_veri.py): senaryo ya da sınıf listesi değişince
      # sentetik kayıtlar kendiliğinden yenileniyor, aynı kaldığında
      # hiçbir şeye dokunulmuyor. Zorlama yalnızca ELLE müdahale
      # kapısıdır ve Render panelinden eklenir:
      #
      #   Environment → Add Environment Variable
      #     DEMO_VERISI_ZORLA = 1
      #   → Deploy → açılış kaydında "Demo verisi yeniden kuruluyor"
      #   → değişkeni SİLİN (yoksa her dağıtımda yeniden kurulur ve
      #     jürinin girdiği kayıtlar da silinir)
      #
      # Blueprint'e yazılsaydı panelden verilen değer her dağıtımda
      # geri alınırdı; o yüzden burada yalnızca belgelenir.