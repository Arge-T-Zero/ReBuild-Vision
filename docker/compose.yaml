# ReBuild Vision — çalıştırılabilir uygulama paketi
#
# Şartname Madde 10.3: proje bağımsız bir ortamda kurulabilir ve
# çalıştırılabilir olmalıdır.
#
#   docker compose -f docker/compose.yaml up
#
# ✅ DURUM: 29.08.2026'da Colima + Docker 29.7.2 üzerinde uçtan uca
# DOĞRULANDI (macOS, Apple Silicon / arm64). Dört servis ayağa kalktı,
# göç çalıştı, PostGIS 3.5 doğrulandı, demo verisi yüklendi ve
# http://localhost:8080 üzerinden giriş yapıldı.
# Bkz. docs/karar-kaydi.md K-019 ve docker/README.md.

name: rebuild-vision

services:
  veritabani:
    # PostGIS resmi imajı — PostgreSQL 17 + PostGIS 3.5
    # PostGIS GPL-2.0 lisanslıdır (docs/lisans-analizi.md Bölüm 4).
    image: postgis/postgis:17-3.5
    # ⚠️ PLATFORM SABİTLEMESİ ZORUNLU — silmeyin.
    #
    # `postgis/postgis` resmî imajının **arm64 sürümü yayımlanmıyor**;
    # manifest yalnızca linux/amd64 içeriyor. Bu satır olmadan Apple
    # Silicon'lu bir makinede `docker compose up` şu hatayla düşer:
    #
    #   no matching manifest for linux/arm64/v8 in the manifest list
    #
    # Yani jüri üyesi M serisi bir Mac kullanıyorsa sistem HİÇ açılmazdı.
    # Bu satırla amd64 imajı emülasyonla çalışır: 29.08.2026'da Apple
    # Silicon üzerinde denendi, sağlık kontrolünden geçti (healthy),
    # PostGIS 3.5 USE_GEOS=1 USE_PROJ=1 doğrulandı. Emülasyon açılışı
    # yavaşlatır (~40 sn), demo için sorun değildir.
    #
    # Alternatif: `imresamu/postgis:17-3.5` çok mimarili (amd64 + arm64)
    # ve emülasyon gerektirmez; ancak topluluk derlemesidir. Resmî
    # tedarik zinciri tercih edildiği için seçilmedi (K-019).
    platform: linux/amd64
    environment:
      POSTGRES_DB: rebuild_vision
      POSTGRES_USER: rebuild
      POSTGRES_PASSWORD: ${VERITABANI_PAROLA:-gelistirme_parolasi_DEGISTIRIN}
    volumes:
      - veritabani_verisi:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebuild -d rebuild_vision"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Sahte model servisi. Gerçek model hazır olduğunda `model-service`
  # eklenecek ve api'nin MODEL_SERVICE_URL değeri ona çevrilecektir —
  # tek satırlık değişiklik (docs/lisans-analizi.md Bölüm 3.4).
  model-mock:
    build:
      context: ..
      dockerfile: docker/model-mock.Dockerfile
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8090/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      VERITABANI_URL: postgresql+asyncpg://rebuild:${VERITABANI_PAROLA:-gelistirme_parolasi_DEGISTIRIN}@veritabani:5432/rebuild_vision
      MODEL_SERVICE_URL: http://model-mock:8090
      JWT_GIZLI_ANAHTAR: ${JWT_GIZLI_ANAHTAR:-gelistirme-icin-guvensiz-anahtar-DEGISTIRIN}
      IZIN_VERILEN_KAYNAKLAR: http://localhost:8080
      YUKLEME_KLASORU: api/yuklenenler
    volumes:
      - yuklenen_goruntuler:/uygulama/api/yuklenenler
    depends_on:
      veritabani:
        condition: service_healthy
      model-mock:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      # Tek giriş noktası: arayüz ve /api vekili aynı porttan sunulur.
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  veritabani_verisi:
  yuklenen_goruntuler:
