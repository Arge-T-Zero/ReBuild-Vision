# ReBuild Vision — web arayüzü sunumu ve API vekili.
#
# Geliştirmede bu işi Vite'ın kendi vekili yapar (web/vite.config.ts).
# Konteynerde aynı yol haritası nginx tarafından sağlanır; böylece
# arayüz kodu her iki ortamda da `/api/...` çağırır ve değişmez.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API istekleri backend konteynerine iletilir.
    # `/api` öneki soyulur: backend uç noktaları /auth, /tespit, ... biçimindedir.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Görüntü yüklemesi toplu yapılabilir.
        client_max_body_size 64m;
        proxy_read_timeout 120s;
    }

    # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Derleme çıktısı içerik özetli adlar taşır; uzun süre önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
