<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Türkçe karakterleri (ğ ş ı İ ç ö ü) tam destekleyen üç aile:
         Manrope başlık, Inter gövde, IBM Plex Mono sayısal değerler. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tema, React yüklenmeden uygulanır: sayfa açılırken yanıp sönme olmaz. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('rebuild_vision_tema');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* depolama kapalıysa koyu temada kalır */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReBuild Vision</title>
    <meta name="description" content="Afet sonrası enkaz malzemelerinin görüntü tabanlı ön sınıflandırması ve doğrulanabilir kaynak haritası. Ölçüm yoksa miktar üretilmez; her model çıktısı ön tahmindir." />
    <meta name="theme-color" content="#000000" />

    <!-- Bağlantı paylaşımı önizlemesi (WhatsApp, LinkedIn, X, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReBuild Vision" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="ReBuild Vision — enkaz malzemeleri kaynak haritası" />
    <meta property="og:description" content="İnsan denetimli ön sınıflandırma. Ölçüm yoksa miktar üretilmez, tehlikeli madde teşhisi yapılmaz. TEKNOFEST 2026 · Takım Arge-T Zero." />
    <meta property="og:url" content="https://re-build-vision.vercel.app" />
    <meta property="og:image" content="https://re-build-vision.vercel.app/gorseller/og-kapak-1.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ReBuild Vision — enkaz alanı üzerinde malzeme tespit kutuları" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReBuild Vision — enkaz malzemeleri kaynak haritası" />
    <meta name="twitter:description" content="İnsan denetimli ön sınıflandırma. Ölçüm yoksa miktar üretilmez." />
    <meta name="twitter:image" content="https://re-build-vision.vercel.app/gorseller/og-kapak-1.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
