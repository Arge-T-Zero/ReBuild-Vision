<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Giriş ekranının arka planı; en büyük görsel öğe olduğu için
         önceden yüklenir (LCP).

         `media` ZORUNLU: önceden bu satır koşulsuzdu ve TELEFONA da
         170 KB'lık masaüstü sürümünü indirtiyordu — üstelik o sürüm
         mobilde hiç gösterilmiyordu bile. Her cihaz artık yalnızca
         gerçekten göstereceği dosyayı çeker. -->
    <link rel="preload" as="image" href="/gorseller/giris-hero.webp"
      media="(min-width: 1024px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/gorseller/giris-hero-kucuk.webp"
      media="(max-width: 1023.98px)" fetchpriority="high" />

    <!-- Tema, React yüklenmeden uygulanır: sayfa açılırken yanıp sönme olmaz.
         Varsayılan AÇIK temadır (güneş altında okunurluk); kayıtlı bir
         tercih varsa o kazanır. -->
    <script>
      (function () {
        var t = 'light';
        try {
          // `_secim` sonekli anahtar: eskisi kullanıcı seçmese de her
          // açılışta yazılıyordu ve siteyi bir kez açmış herkeste
          // "dark" olarak kaldı. Okunsaydı varsayılanı açık yapmak eski
          // ziyaretçilerde hiçbir şey değiştirmezdi. Bkz. tema.tsx.
          var k = localStorage.getItem('rebuild_vision_tema_secim');
          if (k === 'light' || k === 'dark') t = k;
        } catch (e) { /* depolama kapalıysa açık temada kalır */ }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.background =
          t === 'dark' ? '#000000' : '#f5f6f3';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReBuild Vision</title>
    <meta name="description" content="Afet sonrası enkaz malzemelerinin görüntü tabanlı ön sınıflandırması ve doğrulanabilir kaynak haritası. Ölçüm yoksa miktar üretilmez; her model çıktısı ön tahmindir." />
    <!-- Açılış rengi açık temanınki; tema değişince tema.tsx günceller. -->
    <meta name="theme-color" content="#f5f6f3" />

    <!-- Bağlantı paylaşımı önizlemesi (WhatsApp, LinkedIn, X, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReBuild Vision" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="ReBuild Vision — enkaz malzemeleri kaynak haritası" />
    <meta property="og:description" content="İnsan denetimli ön sınıflandırma. Ölçüm yoksa miktar üretilmez, tehlikeli madde teşhisi yapılmaz. TEKNOFEST 2026 · Takım Arge-T Zero." />
    <meta property="og:url" content="https://re-build-vision.vercel.app" />
    <meta property="og:image" content="https://re-build-vision.vercel.app/gorseller/og-kapak.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ReBuild Vision — enkaz alanı üzerinde malzeme tespit kutuları" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReBuild Vision — enkaz malzemeleri kaynak haritası" />
    <meta name="twitter:description" content="İnsan denetimli ön sınıflandırma. Ölçüm yoksa miktar üretilmez." />
    <meta name="twitter:image" content="https://re-build-vision.vercel.app/gorseller/og-kapak.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
